# Channeled — optional Docker deployment (native install remains fully supported).
# Usage:
#   cp ops/docker/compose.env.example ops/docker/compose.env   # edit secrets
#   docker compose --env-file ops/docker/compose.env up -d --build
#   docker compose --env-file ops/docker/compose.env exec api \
#     dotnet Channeled.Api.dll seed-operator --email you@example.com --password 'YourPassword1!' --name Operator
#
# Optional MinIO object store:
#   docker compose --env-file ops/docker/compose.env --profile minio up -d --build

name: channeled

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-channeled}
      POSTGRES_USER: ${POSTGRES_USER:-channeled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-channeled_dev_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-channeled} -d ${POSTGRES_DB:-channeled}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - channeled

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${CHANNELED_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      MigrateOnStartup: "true"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-channeled};Username=${POSTGRES_USER:-channeled};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      PORT: "8080"
      FileStore__Kind: ${FILE_STORE_KIND:-FileSystem}
      FileStore__RootPath: /app/data/object-store
      FileStore__Endpoint: ${FILE_STORE_ENDPOINT:-http://minio:9000}
      FileStore__Bucket: ${FILE_STORE_BUCKET:-channeled}
      FileStore__AccessKey: ${FILE_STORE_ACCESS_KEY:-}
      FileStore__SecretKey: ${FILE_STORE_SECRET_KEY:-}
      FileStore__ForcePathStyle: ${FILE_STORE_FORCE_PATH_STYLE:-true}
      FileStore__Region: ${FILE_STORE_REGION:-us-east-1}
      Backup__RootPath: /app/data/backups
      Backup__AlertEmail: ${BACKUP_ALERT_EMAIL:-ops@example.com}
      DataProtection__KeysPath: /app/data/dp-keys
      Operations__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Realtime__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      PublicFileLinks__Enabled: ${PUBLIC_FILE_LINKS_ENABLED:-false}
      PublicFileLinks__HmacKey: ${PUBLIC_FILE_LINKS_HMAC_KEY:-}
      Account__SelfServiceMail: ${ACCOUNT_SELF_SERVICE_MAIL:-Auto}
      Chat__PostsPerMinutePerUser: ${CHAT_POSTS_PER_MINUTE:-30}
    volumes:
      - object_store:/app/data/object-store
      - backups:/app/data/backups
      - dp_keys:/app/data/dp-keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - channeled

  # Optional S3-compatible store. Start with: --profile minio
  # Then set FILE_STORE_KIND=S3Compatible and FILE_STORE_S3_* in compose.env.
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-channeled}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-channeled_minio_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - channeled

  minio-init:
    profiles: ["minio"]
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        i=$$((i+1)); if [ $$i -gt 30 ]; then exit 1; fi; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$FILE_STORE_BUCKET\"
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-channeled}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-channeled_minio_change_me}
      FILE_STORE_BUCKET: ${FILE_STORE_BUCKET:-channeled}
    networks:
      - channeled

volumes:
  pgdata:
  object_store:
  backups:
  dp_keys:
  minio_data:

networks:
  channeled:
    driver: bridge
