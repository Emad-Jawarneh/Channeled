# Keep Railway on Railpack (railpack.json). A root Dockerfile is for local
# docker compose; without this, Railway switches to Docker and the process
# listens on 8080 while the platform routes to $PORT → crash loop.
[build]
builder = "RAILPACK"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
