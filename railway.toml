# Deploy with the Compose Dockerfile. Entrypoint binds ASPNETCORE_URLS to $PORT.
[build]
builder = "DOCKERFILE"
dockerfilePath = "ops/docker/Dockerfile"

[deploy]
# Liveness only (/health always 200 once listening). Migrations run before listen.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
